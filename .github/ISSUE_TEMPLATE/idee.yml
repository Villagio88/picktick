name: Idee oder Wunsch
description: Vorschlag für eine neue Funktion
labels: [idee]
body:
  - type: textarea
    id: problem
    attributes:
      label: Welches Problem soll gelöst werden?
      description: Beschreibe die Situation an deiner Schule, nicht nur die Lösung.
    validations:
      required: true
  - type: textarea
    id: vorschlag
    attributes:
      label: Wie könnte es aussehen?
  - type: input
    id: rolle
    attributes:
      label: Deine Rolle
      description: zum Beispiel PICTS, TICTS, ICT-Verantwortliche, Schulleitung
