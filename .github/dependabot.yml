version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Grosse Versionssprünge bewusst und von Hand, nicht als Flut von Vorschlägen
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      abhaengigkeiten:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      aktionen:
        patterns: ['*']
