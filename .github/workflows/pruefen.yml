name: Prüfen

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typen
        run: npm run typecheck
      - name: Lint
        run: npx eslint .
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Abhängigkeiten ohne bekannte hohe Lücken
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -t picktick:ci .
